# Schema of the product structural model.
# Canonical source of: ID prefixes, types, directories and allowed relations.
# Read by scripts/validate-system-model, scripts/regen and scripts/sysq.
# Format: YAML subset documented in docs/system/conventions.md.
# Changing this file is a model change: record a DEC if it alters semantics.

version: 1

# Lifecycle states (common to all types).
statuses: [proposed, active, deprecated, retired]

# Implementation state (only types with implementable: true).
implementation_states: [none, partial, implemented, verified]

# Evidence level of the card.
#   verified-code  checked by reading code/tests (requires `code` or `test_code`)
#   declared-doc   declared by documentation or by a person
#   inferred       inferred with partial evidence
#   unknown        pending investigation
evidence_levels: [verified-code, declared-doc, inferred, unknown]

# Product code roots (DEC-008).
# If a diff touches these paths without touching docs/system/, the validator warns.
code_roots: [src/]

# Fields every card must declare.
common_required: [id, type, name, status, evidence]

# Common optional fields.
common_optional: [summary, aliases, tags, implementation, code, test_code, relations, uncertainties, commits]

types:
  ACT:
    type: actor
    dir: docs/system/actors
    implementable: false
    relations:
      specializes: [ACT]
  REQ:
    type: requirement
    dir: docs/system/requirements
    implementable: false
    relations:
      actors: [ACT]
      features: [FEAT]
      constraints: [NFR, VAL]
      depends_on: [REQ]
      decisions: [DEC]
  NFR:
    type: quality-attribute
    dir: docs/system/quality
    implementable: false
    relations:
      tests: [TST]
      decisions: [DEC]
  FEAT:
    type: feature
    dir: docs/system/features
    implementable: true
    relations:
      entities: [ENT]
      functions: [FUN]
      interfaces: [API]
      integrations: [INT]
      depends_on: [FEAT]
      decisions: [DEC]
  ENT:
    type: entity
    dir: docs/system/domain/entities
    implementable: true
    relations:
      related: [ENT]
      validations: [VAL]
      decisions: [DEC]
  FUN:
    type: function
    dir: docs/system/domain/functions
    implementable: true
    relations:
      entities: [ENT]
      validations: [VAL]
      calls: [FUN, API, INT]
      tests: [TST]
      decisions: [DEC]
  VAL:
    type: validation
    dir: docs/system/domain/validations
    implementable: true
    relations:
      tests: [TST]
      decisions: [DEC]
  API:
    type: interface
    dir: docs/system/interfaces
    implementable: true
    relations:
      providers: [FUN, INT]
      consumers: [ACT, FEAT, FUN, INT]
      entities: [ENT]
      validations: [VAL]
      tests: [TST]
      decisions: [DEC]
  INT:
    type: integration
    dir: docs/system/integrations
    implementable: true
    relations:
      interfaces: [API]
      depends_on: [INT]
      tests: [TST]
      decisions: [DEC]
  DEC:
    type: decision
    dir: docs/system/decisions
    implementable: false
    relations:
      affects: [ACT, REQ, NFR, FEAT, ENT, FUN, VAL, API, INT, TST]
      supersedes: [DEC]
  TST:
    type: test
    dir: docs/system/quality/tests
    implementable: true
    relations: {}
